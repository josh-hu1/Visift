[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "visift"
version = "0.1.0"
description = "Rank which charts are worth looking at first in a new tabular dataset."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.1,<4",
    "scipy>=1.11,<2",
    "scikit-learn>=1.3,<2",
    "plotly>=5.18,<8",
]

[project.optional-dependencies]
app = ["streamlit>=1.57,<2"]
dev = ["ruff>=0.17,<0.18", "pytest>=8", "pytest-cov>=5"]

[project.urls]
Homepage = "https://visift-hq3sfksqtjznd4z8cuutv3.streamlit.app"
Repository = "https://github.com/josh-hu1/Visift"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "."]
extend-exclude = ["evaluation/results"]

[tool.ruff.format]
# Collapse the one-argument-per-line call style wherever it fits on one line.
skip-magic-trailing-comma = true

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = [
    "E501",  # line length is handled by the formatter; long strings are fine
]

[tool.ruff.lint.isort]
known-first-party = ["visift", "evaluation"]
split-on-trailing-comma = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = ["slow: tests that take more than a few seconds"]

[tool.coverage.run]
source = ["visift"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
