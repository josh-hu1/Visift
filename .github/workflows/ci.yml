name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # ruff and mypy versions are pinned in the [dev] extra.
      - run: pip install -e ".[dev]"
      - run: ruff check --output-format=github .
      - run: ruff format --check .
      - name: mypy (src/visift)
        run: mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[app,dev]"
      - name: Run tests
        run: pytest --cov=visift --cov-branch --cov-report=term-missing
      - name: Coverage summary
        if: always()
        run: |
          if [ -f .coverage ]; then
            {
              echo "### Coverage (Python ${{ matrix.python-version }}): $(coverage report --format=total)%"
              echo
              coverage report --format=markdown
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  package:
    name: Build and install the package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          twine check --strict dist/*
      - name: Install the wheel in a fresh venv (no repo on the path)
        run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install dist/*.whl
          cd /tmp
          /tmp/fresh/bin/visift --version
          /tmp/fresh/bin/visift analyze --sample penguins --top 3 --html /tmp/report.html --json /tmp/recs.json
          /tmp/fresh/bin/python -c "import visift, sys; recs = visift.recommend(visift.load_sample('titanic'), target='survived', top=3); print(recs.to_frame()); assert 'streamlit' not in sys.modules"
          test -s /tmp/report.html && test -s /tmp/recs.json
